<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ببخشید دوست خوبم 💛</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe3ef;--bg2:#fff3c4;--bg3:#d8f5ea;--card:#ffffffd9;--ink:#4a2c5a;--pink:#ff6fa5;--yellow:#ffc93c;--mint:#3ed6a5;--purple:#8e6bff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3a1d4a;--bg2:#4a2f3d;--bg3:#1f3f46;--card:#2b1b3acc;--ink:#fff1f7}}
:root[data-theme="dark"]{--bg1:#3a1d4a;--bg2:#4a2f3d;--bg3:#1f3f46;--card:#2b1b3acc;--ink:#fff1f7}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Vazirmatn',Tahoma,sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;
background:linear-gradient(120deg,var(--bg1),var(--bg2),var(--bg3),var(--bg1));background-size:300% 300%;animation:bg 14s ease infinite}
@keyframes bg{50%{background-position:100% 50%}}
.float{position:fixed;top:100%;font-size:26px;pointer-events:none;animation:up linear forwards;z-index:0}
@keyframes up{to{transform:translateY(-120vh) rotate(40deg);opacity:0}}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:24px 16px 60px;text-align:center}
.hero{background:var(--card);border-radius:32px;padding:24px 18px;box-shadow:0 12px 40px #ff6fa540;backdrop-filter:blur(6px)}
h1{font-size:clamp(28px,7vw,46px);margin:8px 0;font-weight:900;background:linear-gradient(90deg,var(--pink),var(--purple),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
p{line-height:2;font-size:17px;margin:6px 0}
svg.bear{width:min(260px,70%);height:auto;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(2deg)}}
.tear{animation:tear 2s infinite}@keyframes tear{0%{transform:translateY(0);opacity:1}100%{transform:translateY(20px);opacity:0}}
.heart{animation:beat 1.2s infinite;transform-origin:center;transform-box:fill-box}@keyframes beat{50%{transform:scale(1.25)}}
input{font:inherit;padding:10px 16px;border-radius:999px;border:2px solid var(--pink);background:#fff;color:#4a2c5a;width:min(260px,100%);text-align:center;outline:none}
h2{margin:36px 0 14px;font-size:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.ex{border:0;font:inherit;cursor:pointer;color:#4a2c5a;border-radius:24px;padding:20px 12px;font-size:16px;font-weight:700;box-shadow:0 6px 18px #0001;transition:transform .25s;animation:pop .6s backwards}
.ex:hover{transform:translateY(-6px) rotate(-2deg) scale(1.04)}
.ex span{display:block;font-size:38px;margin-bottom:6px}
.ex:nth-child(1){background:#ffd1e3;animation-delay:.1s}.ex:nth-child(2){background:#fff0a8;animation-delay:.2s}.ex:nth-child(3){background:#c8f4e3;animation-delay:.3s}
.ex:nth-child(4){background:#e2d6ff;animation-delay:.4s}.ex:nth-child(5){background:#ffdcb8;animation-delay:.5s}.ex:nth-child(6){background:#c9ecff;animation-delay:.6s}
@keyframes pop{from{transform:scale(.3);opacity:0}}
#pick{min-height:64px;margin:18px 0;font-size:19px;font-weight:700;color:var(--pink)}
.btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;position:relative;min-height:70px;margin-top:10px}
button.b{font:inherit;font-weight:900;font-size:18px;border:0;border-radius:999px;padding:14px 28px;cursor:pointer;color:#fff;box-shadow:0 8px 20px #0003}
#yes{background:linear-gradient(90deg,var(--pink),var(--purple));animation:beat 1.4s infinite}
#no{background:#9aa0b5}
#msg{display:none;margin-top:22px;background:var(--card);border-radius:28px;padding:22px;font-size:20px;font-weight:700;animation:pop .6s}
.photos{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.photos svg{width:calc(33% - 10px);min-width:96px;border-radius:22px;box-shadow:0 6px 18px #0002;animation:bob 4s ease-in-out infinite}
.photos svg:nth-child(2){animation-delay:.6s}.photos svg:nth-child(3){animation-delay:1.2s}
</style>
</head>
<body>
<main>
 <section class="hero">
  <svg class="bear" viewBox="0 0 200 210" aria-label="خرس عذرخواه">
   <circle cx="55" cy="45" r="24" fill="#c98a5b"/><circle cx="145" cy="45" r="24" fill="#c98a5b"/>
   <circle cx="55" cy="45" r="12" fill="#ffb7cf"/><circle cx="145" cy="45" r="12" fill="#ffb7cf"/>
   <ellipse cx="100" cy="150" rx="55" ry="50" fill="#d9a070"/>
   <circle cx="100" cy="90" r="55" fill="#e0a975"/>
   <ellipse cx="100" cy="108" rx="24" ry="18" fill="#f7d9b8"/><ellipse cx="100" cy="100" rx="8" ry="6" fill="#4a2c5a"/>
   <circle cx="78" cy="82" r="7" fill="#4a2c5a"/><circle cx="122" cy="82" r="7" fill="#4a2c5a"/>
   <circle cx="80" cy="80" r="2.5" fill="#fff"/><circle cx="124" cy="80" r="2.5" fill="#fff"/>
   <path d="M88 120q12-8 24 0" stroke="#4a2c5a" stroke-width="3" fill="none" stroke-linecap="round"/>
   <circle cx="62" cy="102" r="9" fill="#ff9ec0" opacity=".7"/><circle cx="138" cy="102" r="9" fill="#ff9ec0" opacity=".7"/>
   <ellipse class="tear" cx="70" cy="98" rx="4" ry="7" fill="#7cc8ff"/>
   <path d="M100 160l-6-8c-4-6 4-12 6-6 2-6 10 0 6 6z" class="heart" fill="#ff4f8b"/>
   <circle cx="45" cy="165" r="16" fill="#e0a975"/><circle cx="155" cy="165" r="16" fill="#e0a975"/>
   <g transform="translate(150 140)"><line x1="0" y1="0" x2="0" y2="38" stroke="#3ed6a5" stroke-width="4"/>
   <g fill="#ffc93c"><circle cx="0" cy="-8" r="9"/><circle cx="9" cy="0" r="9"/><circle cx="-9" cy="0" r="9"/><circle cx="0" cy="8" r="9"/></g><circle r="6" fill="#ff6fa5"/></g>
  </svg>
  <h1>ببخشید <span id="nm">رفیقم</span> 💛</h1>
  <p>می‌دونم خراب کردم... ولی دلم برات تنگ شده و دوستیمون برام از همه چی مهم‌تره.</p>
  <input id="name" placeholder="اسم دوستم رو بنویس ✍️" maxlength="20">
 </section>

 <h2>🙈 چندتا بهانه‌ی خیلی معتبر</h2>
 <p>روی هر کدوم بزن!</p>
 <div class="grid" id="grid"></div>
 <div id="pick"></div>

 <h2>📸 خاطره‌های خوب ما</h2>
 <div class="photos">
  <svg viewBox="0 0 120 120"><rect width="120" height="120" fill="#ffd1e3"/><circle cx="60" cy="50" r="22" fill="#ffc93c"/><g stroke="#ffc93c" stroke-width="4"><path d="M60 14v-8M60 94v8M24 50h-8M96 50h8"/></g><path d="M0 100q30-20 60 0t60 0v20H0z" fill="#3ed6a5"/><text x="60" y="112" font-size="14" text-anchor="middle" fill="#fff">☀️ سفر</text></svg>
  <svg viewBox="0 0 120 120"><rect width="120" height="120" fill="#e2d6ff"/><path d="M60 95l-30-32c-12-14 8-34 30-14 22-20 42 0 30 14z" fill="#ff6fa5" class="heart"/><text x="60" y="112" font-size="14" text-anchor="middle" fill="#4a2c5a">دوستی</text></svg>
  <svg viewBox="0 0 120 120"><rect width="120" height="120" fill="#c8f4e3"/><path d="M40 40h40l-6 44H46z" fill="#fff"/><circle cx="60" cy="34" r="16" fill="#ffb7cf"/><circle cx="52" cy="28" r="5" fill="#ff6fa5"/><text x="60" y="112" font-size="14" text-anchor="middle" fill="#4a2c5a">🍦 بستنی</text></svg>
 </div>

 <h2>🥺 منو می‌بخشی؟</h2>
 <div class="btns" id="btns">
  <button class="b" id="yes">آره، بخشیدمت! 💖</button>
  <button class="b" id="no">نه 😤</button>
 </div>
 <div id="msg"></div>
</main>
<script>
const ex=[["📱","گوشیم شارژ نداشت!"],["🐱","گربه‌م کیبوردو خورد"],["🧠","مغزم رفته بود مرخصی"],["✨","ستاره‌ها تو برج بد بودن"],["🍦","بستنی نخورده بودم، عقلم کار نمی‌کرد"],["🙏","فقط چون خیلی دوستت دارم!"]];
const g=document.getElementById('grid'),pick=document.getElementById('pick');
ex.forEach(([e,t])=>{const b=document.createElement('button');b.className='ex';b.innerHTML='<span>'+e+'</span>'+t;
b.onclick=()=>{pick.textContent=e+' '+t+' ... باشه باشه، بهانه‌ها همه بامزه بودن ولی حق با توئه، ببخشید! 😅';burst(6)};g.appendChild(b)});
function fl(em){const s=document.createElement('div');s.className='float';s.textContent=em;s.style.left=Math.random()*100+'vw';s.style.animationDuration=(6+Math.random()*7)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),13000)}
const E=['💛','🌸','🎈','⭐','💖','🌼','🍭'];
setInterval(()=>fl(E[Math.random()*E.length|0]),700);
function burst(n){for(let i=0;i<n;i++)setTimeout(()=>fl(E[Math.random()*E.length|0]),i*80)}
const nm=document.getElementById('nm');
document.getElementById('name').oninput=e=>nm.textContent=e.target.value.trim()||'رفیقم';
const no=document.getElementById('no');
function dodge(){const w=document.getElementById('btns').clientWidth-no.offsetWidth;no.style.position='absolute';no.style.left=Math.max(0,Math.random()*w)+'px';no.style.top=(Math.random()*50)+'px'}
no.addEventListener('mouseover',dodge);no.addEventListener('touchstart',e=>{e.preventDefault();dodge()},{passive:false});no.onclick=dodge;
document.getElementById('yes').onclick=()=>{const m=document.getElementById('msg');m.style.display='block';
m.innerHTML='ایوووول! 🎉 مرسی که بخشیدی '+nm.textContent+' جان! قول می‌دم دیگه تکرار نشه... بستنی با من 🍦💛';burst(60);m.scrollIntoView({behavior:'smooth'})};
</script>
</body>
</html>
