<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ببخشید دوست خوبم 💛</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
 <section class="hero">
  <svg class="bear" viewBox="0 0 200 210" aria-label="خرس عذرخواه">
   <circle cx="55" cy="45" r="24" fill="#c98a5b"/><circle cx="145" cy="45" r="24" fill="#c98a5b"/>
   <circle cx="55" cy="45" r="12" fill="#ffb7cf"/><circle cx="145" cy="45" r="12" fill="#ffb7cf"/>
   <ellipse cx="100" cy="150" rx="55" ry="50" fill="#d9a070"/>
   <circle cx="100" cy="90" r="55" fill="#e0a975"/>
   <ellipse cx="100" cy="108" rx="24" ry="18" fill="#f7d9b8"/><ellipse cx="100" cy="100" rx="8" ry="6" fill="#4a2c5a"/>
   <circle cx="78" cy="82" r="7" fill="#4a2c5a"/><circle cx="122" cy="82" r="7" fill="#4a2c5a"/>
   <circle cx="80" cy="80" r="2.5" fill="#fff"/><circle cx="124" cy="80" r="2.5" fill="#fff"/>
   <path d="M88 120q12-8 24 0" stroke="#4a2c5a" stroke-width="3" fill="none" stroke-linecap="round"/>
   <circle cx="62" cy="102" r="9" fill="#ff9ec0" opacity=".7"/><circle cx="138" cy="102" r="9" fill="#ff9ec0" opacity=".7"/>
   <ellipse class="tear" cx="70" cy="98" rx="4" ry="7" fill="#7cc8ff"/>
   <path d="M100 160l-6-8c-4-6 4-12 6-6 2-6 10 0 6 6z" class="heart" fill="#ff4f8b"/>
   <circle cx="45" cy="165" r="16" fill="#e0a975"/><circle cx="155" cy="165" r="16" fill="#e0a975"/>
   <g transform="translate(150 140)"><line x1="0" y1="0" x2="0" y2="38" stroke="#3ed6a5" stroke-width="4"/>
   <g fill="#ffc93c"><circle cx="0" cy="-8" r="9"/><circle cx="9" cy="0" r="9"/><circle cx="-9" cy="0" r="9"/><circle cx="0" cy="8" r="9"/></g><circle r="6" fill="#ff6fa5"/></g>
  </svg>
  <h1>ببخشید <span id="nm">رفیقم</span> 💛</h1>
  <p>می‌دونم خراب کردم... ولی دلم برات تنگ شده و دوستیمون برام از همه چی مهم‌تره.</p>
  <input id="name" placeholder="اسم دوستم رو بنویس ✍️" maxlength="20">
 </section>

 <h2>🙈 چندتا بهانه‌ی خیلی معتبر</h2>
 <p>روی هر کدوم بزن!</p>
 <div class="grid" id="grid"></div>
 <div id="pick"></div>

 <h2>📸 خاطره‌های خوب ما</h2>
 <div class="photos">
  <svg viewBox="0 0 120 120"><rect width="120" height="120" fill="#ffd1e3"/><circle cx="60" cy="50" r="22" fill="#ffc93c"/><g stroke="#ffc93c" stroke-width="4"><path d="M60 14v-8M60 94v8M24 50h-8M96 50h8"/></g><path d="M0 100q30-20 60 0t60 0v20H0z" fill="#3ed6a5"/><text x="60" y="112" font-size="14" text-anchor="middle" fill="#fff">☀️ سفر</text></svg>
  <svg viewBox="0 0 120 120"><rect width="120" height="120" fill="#e2d6ff"/><path d="M60 95l-30-32c-12-14 8-34 30-14 22-20 42 0 30 14z" fill="#ff6fa5" class="heart"/><text x="60" y="112" font-size="14" text-anchor="middle" fill="#4a2c5a">دوستی</text></svg>
  <svg viewBox="0 0 120 120"><rect width="120" height="120" fill="#c8f4e3"/><path d="M40 40h40l-6 44H46z" fill="#fff"/><circle cx="60" cy="34" r="16" fill="#ffb7cf"/><circle cx="52" cy="28" r="5" fill="#ff6fa5"/><text x="60" y="112" font-size="14" text-anchor="middle" fill="#4a2c5a">🍦 بستنی</text></svg>
 </div>

 <h2>🥺 منو می‌بخشی؟</h2>
 <div class="btns" id="btns">
  <button class="b" id="yes">آره، بخشیدمت! 💖</button>
  <button class="b" id="no">نه 😤</button>
 </div>
 <div id="msg"></div>
</main>
<script src="script.js"></script>
</body>
</html>
